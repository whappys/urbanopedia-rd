<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🧠 Test Mental - Pregunta</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- BANNER SUPERIOR -->
  <div class="ad-slot ad-top"><div class="ad-label">PUBLICIDAD</div><div class="ad-placeholder"><div class="placeholder-text">AQUÍ PUBLICIDAD</div><div class="placeholder-size">728x90 / 320x50</div><!-- PEGA AQUÍ CÓDIGO ADSTERRA --></div></div>

  <div class="main-wrapper" style="display:grid; grid-template-columns:180px 1fr 180px; gap:20px; max-width:1400px; margin:0 auto; padding:20px;">
    <aside class="ad-slot ad-left"><div class="ad-label">PUBLICIDAD</div><div class="ad-placeholder"><div class="placeholder-text">AQUÍ<br>PUBLICIDAD</div><div class="placeholder-size">160x600</div><!-- PEGA AQUÍ CÓDIGO ADSTERRA --></div></aside>

    <div id="app">
      <section id="scr-quiz" class="screen">
        <header class="qhead">
          <span id="qnum">1/20</span>
          <span>🧠 Test Mental</span>
          <span class="qscore" id="live">0 ✓</span>
        </header>
        <div class="bar"><i id="bar"></i></div>
        <h2 class="ask" id="ask"></h2>
        <div id="figures"></div>
        <button class="btn sec hintbtn" id="hintbtn"></button>
        <div id="hintbox"></div>
        <div class="opts" id="opts"></div>
        <div id="fb"></div>
        <button class="btn" id="next" disabled>Siguiente →</button>
      </section>
    </div>

    <aside class="ad-slot ad-right"><div class="ad-label">PUBLICIDAD</div><div class="ad-placeholder"><div class="placeholder-text">AQUÍ<br>PUBLICIDAD</div><div class="placeholder-size">160x600</div><!-- PEGA AQUÍ CÓDIGO ADSTERRA --></div></aside>
  </div>

  <!-- BANNER INFERIOR MÓVIL -->
  <div class="ad-slot ad-bottom"><div class="ad-label">PUBLICIDAD</div><div class="ad-placeholder"><div class="placeholder-text">AQUÍ PUBLICIDAD</div><div class="placeholder-size">320x50</div><!-- PEGA AQUÍ CÓDIGO ADSTERRA --></div></div>

<script src="datos.js"></script>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(window.location.search);
let idx = parseInt(params.get('q')) || 0;

// Validación de seguridad
if (idx < 0 || idx >= 20) { window.location.href = 'resultado.html'; }

let score = parseInt(localStorage.getItem('session_score')) || 0;
let answered = JSON.parse(localStorage.getItem('session_answered')) || Array(20).fill(null);
let hintShown = JSON.parse(localStorage.getItem('session_hints')) || Array(20).fill(false);
let hintBusy = false;
const hasFB = typeof FBInstant !== 'undefined';

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

// Preparar pregunta actual con opciones barajadas (pero guardamos el mapeo)
const q = QUESTIONS[idx];
const perm = shuffle([0,1,2,3]);

function render() {
  $('#qnum').textContent = (idx + 1) + '/20';
  $('#bar').style.width = ((idx) / 20 * 100) + '%';
  $('#ask').textContent = q.ask;
  $('#fb').innerHTML = '';
  $('#hintbox').innerHTML = '';
  
  const hb = $('#hintbtn');
  hb.disabled = hintShown[idx] || answered[idx] != null || hintBusy;
  hb.innerHTML = '💡 Pedir pista' + (hasFB ? '<small></small>' : '<small>opcional</small>');
  
  const fig = $('#figures');
  if (q.view === 'panel') { fig.innerHTML = `<div class="panel">${q.panel}</div>`; }
  else { fig.innerHTML = `<div class="seq">${q.seq.map(s => `<div class="chip">${s}</div>`).join('<div class="sep">→</div>')}<div class="chip q">?</div></div>`; }
  
  const letters = ['A','B','C','D'];
  $('#opts').innerHTML = perm.map((orig, i) => 
    `<button class="opt" data-i="${i}" aria-label="Opción ${letters[i]}"><span class="letter">${letters[i]}</span>${q.opts[orig]}</button>`
  ).join('');
  
  document.querySelectorAll('#opts .opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  
  $('#next').disabled = answered[idx] == null;
  $('#next').textContent = idx === 19 ? 'Ver resultados →' : 'Siguiente →';
  $('#live').textContent = score + ' ✓';
  
  // Si ya estaba respondida, restaurar estado visual
  if (answered[idx] != null) {
    const orig = answered[idx];
    document.querySelectorAll('#opts .opt').forEach((b, bi) => {
      const o = perm[bi];
      b.classList.add('locked');
      if (o === q.a) b.classList.add('correct');
      else if (o === orig) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    $('#fb').innerHTML = `<div class="fb ${orig === q.a ? 'ok' : 'bad'}"><b>${orig === q.a ? '✅ ¡Correcto!' : '❌ Incorrecto'}</b>${q.exp}</div>`;
  }
}

function choose(i) {
  if (answered[idx] != null) return;
  const orig = perm[i];
  answered[idx] = orig;
  if (orig === q.a) score++;
  
  localStorage.setItem('session_score', score);
  localStorage.setItem('session_answered', JSON.stringify(answered));
  
  document.querySelectorAll('#opts .opt').forEach((b, bi) => {
    const o = perm[bi];
    b.classList.add('locked');
    if (o === q.a) b.classList.add('correct');
    else if (o === orig) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  
  $('#hintbtn').disabled = true;
  const ok = orig === q.a;
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✅ ¡Correcto!' : '❌ Incorrecto'}</b>${q.exp}</div>`;
  $('#bar').style.width = ((idx + 1) / 20 * 100) + '%';
  $('#live').textContent = score + ' ✓';
  $('#next').disabled = false;
}

async function requestHint() {
  if (hintShown[idx] || hintBusy || answered[idx] != null) return;
  hintBusy = true;
  const btn = $('#hintbtn'); btn.innerHTML = '💡 Cargando…';
  let cancelled = false;
  
  if (hasFB && FBInstant.getAdInstance) {
    try {
      const ad = await FBInstant.getAdInstance();
      await ad.loadAsync();
      await ad.showAsync();
    } catch(e) {
      cancelled = /CANCEL/i.test((e && (e.code || e.message)) || '');
    }
  }
  hintBusy = false;
  if (cancelled) {
    btn.innerHTML = '💡 Pedir pista' + (hasFB ? '<small>opcional · ver un anuncio</small>' : '<small>opcional</small>');
    return;
  }
  
  hintShown[idx] = true;
  localStorage.setItem('session_hints', JSON.stringify(hintShown));
  $('#hintbox').innerHTML = `<div class="hintbox">💡 <b>Pista:</b> ${q.hint}</div>`;
  btn.disabled = true; btn.textContent = '💡 Pista mostrada';
}

$('#next').addEventListener('click', () => {
  if (idx < 19) {
    window.location.href = 'pregunta.html?q=' + (idx + 1); // ¡RECARGA LA PÁGINA = NUEVA IMPRESIÓN DE ANUNCIO!
  } else {
    window.location.href = 'resultado.html';
  }
});

$('#hintbtn').addEventListener('click', requestHint);

// Inicializar Facebook si existe
if (hasFB) {
  try { FBInstant.initializeAsync().catch(()=>{}); } catch(e) {}
}

render();
</script>

<p style="text-align:center; margin-top:20px; font-size:12px;">
  <a href="privacy.html" style="color:var(--mut); text-decoration:none;">Política de Privacidad</a>
</p>

</body>
</html>
